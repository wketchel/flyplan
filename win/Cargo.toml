[package]
name = "waypoint-planner"
version = "1.63.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
embed-resource = "2"

[target.'cfg(windows)'.dependencies]
tao = { version = "0.30", default-features = false, features = ["rwh_06"] }
wry = { version = "0.47", default-features = false, features = ["os-webview", "protocol", "drag-drop"] }
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_Devices_PortableDevices", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Ole",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
